name: Deploy to Dev VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  build:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Prisma Generate
        run: npx prisma generate

      - name: Build Application
        run: npm run build
        env:
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}

  deploy:
    name: Deploy to Dev VPS
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="/home/${{ secrets.VPS_USER }}/havenretreatdev"
            fi

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/omprakash-code/havenretreatdev.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            if [ ! -f .env ]; then
              echo "Missing $APP_DIR/.env on VPS. Create it before deploying."
              exit 1
            fi

            docker compose up -d db
            docker compose build app
            docker compose run --rm app npx prisma migrate deploy
            docker compose up -d app
            docker compose ps
